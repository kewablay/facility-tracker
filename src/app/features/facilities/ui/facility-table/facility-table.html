<div class="table-region" role="region" [attr.aria-label]="regionLabel()">
  <p-table
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} facilities"
    [value]="facilities()"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize()"
    [first]="firstRecordIndex()"
    [totalRecords]="total()"
    [rowsPerPageOptions]="pageSizeOptions"
    [showCurrentPageReport]="true"
    [tableStyle]="tableStyle"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr class="header-row">
        <th scope="col">Name</th>
        <th scope="col">Code</th>
        <th scope="col">Type</th>
        <th scope="col">Status</th>
        <th scope="col">Last updated</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      @let facility = asFacility(row);
      <tr class="data-row">
        <th scope="row" class="name-cell">
          <a class="row-link" [routerLink]="[facility.id]">{{ facility.name }}</a>
        </th>
        <td class="data-mono" data-label="Code">{{ facility.code }}</td>
        <td data-label="Type">{{ typeLabel[facility.type] }}</td>
        <td data-label="Status"><app-status-tag [status]="facility.status" /></td>
        <td data-label="Last updated">{{ facility.lastUpdatedAt | date: 'mediumDate' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
